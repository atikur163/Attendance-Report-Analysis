<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>UniAttend - University Attendance & Analytics</title>
    <meta name="description" content="Production-grade university student attendance management, routine scheduling, dynamic QR & face recognition attendance, risk analytics, and exam eligibility platform." />
    <meta property="og:title" content="UniAttend - University Attendance & Analytics" />
    <meta property="og:description" content="Production-grade university student attendance management, routine scheduling, dynamic QR & face recognition attendance, risk analytics, and exam eligibility platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Gracefully silence Vite dev HMR WebSocket disconnects in Cloud Run preview iframe environment
      (function() {
        window.addEventListener('error', function(event) {
          const msg = event?.message || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('websocket') ||
            msg.includes('closed without opened') ||
            msg.includes('failed to connect to websocket')
          ) {
            event.stopImmediatePropagation?.();
            event.preventDefault?.();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reasonStr = String(event?.reason?.message || event?.reason || '');
          if (
            reasonStr.includes('WebSocket') ||
            reasonStr.includes('websocket') ||
            reasonStr.includes('closed without opened') ||
            reasonStr.includes('failed to connect to websocket')
          ) {
            event.stopImmediatePropagation?.();
            event.preventDefault?.();
          }
        });

        // Patch native WebSocket to safely capture error events from Vite HMR client
        const NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            const ws = protocols ? new NativeWebSocket(url, protocols) : new NativeWebSocket(url);
            ws.addEventListener('error', function(e) {
              e.stopImmediatePropagation?.();
            });
            return ws;
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-indigo-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
